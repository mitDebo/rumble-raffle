name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # Figures out which app(s) this push actually touched, so we don't
  # rebuild/redeploy something that didn't change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet test backend/tests/RumbleRaffle.Api.UnitTests/RumbleRaffle.Api.UnitTests.csproj
      - name: Integration tests
        run: dotnet test backend/tests/RumbleRaffle.Api.IntegrationTests/RumbleRaffle.Api.IntegrationTests.csproj

  # Proves migrations actually apply cleanly before anything gets near
  # production: builds a migration bundle from Core's Migrations/ and runs
  # it against a scratch Postgres that lives only for this job. This never
  # touches Supabase and isn't itself how production gets migrated (nothing
  # currently applies migrations there) -- it's a pipeline gate that fails
  # loudly on a bad migration instead of finding out at deploy time.
  backend-migrate:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rumble_raffle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.11
      - name: Build migration bundle
        working-directory: backend
        run: >-
          dotnet ef migrations bundle
          --project src/RumbleRaffle.Core
          --startup-project src/RumbleRaffle.Api
          --output efbundle
      - name: Apply migrations to scratch database
        working-directory: backend
        run: >-
          ./efbundle --verbose
          --connection "Host=localhost;Port=5432;Database=rumble_raffle_ci;Username=postgres;Password=postgres"

  frontend-test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit
      - name: Integration tests
        working-directory: frontend
        run: npm run test:integration
      - name: Build
        working-directory: frontend
        run: npm run build

  backend-build-push:
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/mitdebo/rumble-raffle-backend:latest

  frontend-build-push:
    needs: [changes, frontend-test]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/mitdebo/rumble-raffle-frontend:latest

  deploy:
    needs: [changes, backend-test, backend-migrate, frontend-test, backend-build-push, frontend-build-push]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Runs from the runner directly against Supabase's public connection
      # (the same one the app itself uses) rather than through the droplet
      # -- and deliberately uses `dotnet ef database update` here, not a
      # bundle: that boots RumbleRaffle.Api's real Program.cs, so the
      # connection string below goes through the app's own
      # ConnectionStrings.Normalize() (Supabase hands out "postgres://" URIs;
      # Npgsql needs keyword=value), instead of duplicating that parsing in
      # workflow shell script. backend-migrate's bundle is fine as a bundle
      # since it only ever talks to a scratch connection string that's
      # already keyword=value. This is the actual production migration --
      # nothing else applies migrations to the real database.
      - if: needs.changes.outputs.backend == 'true'
        name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - if: needs.changes.outputs.backend == 'true'
        name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.11
      - if: needs.changes.outputs.backend == 'true'
        name: Apply migrations to production
        working-directory: backend
        env:
          ConnectionStrings__Default: ${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
        run: >-
          dotnet ef database update
          --project src/RumbleRaffle.Core
          --startup-project src/RumbleRaffle.Api
      - name: Copy docker-compose.yml to the droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: 'docker-compose.yml'
          target: '/opt/apps/rumble-raffle/'
      - name: Write production secrets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cat > /opt/apps/rumble-raffle/.env << 'ENVEOF'
            DB_CONNECTION_STRING=${{ secrets.SUPABASE_DB_CONNECTION_STRING }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            ENVEOF
            chmod 600 /opt/apps/rumble-raffle/.env
      - name: Pull and restart containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo docker compose -f /opt/apps/rumble-raffle/docker-compose.yml pull
            sudo docker compose -f /opt/apps/rumble-raffle/docker-compose.yml up -d
